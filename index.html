<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחשבון התאמות</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--card:#fff;--bd:#d5d9e0;--ok:#16883a;--bad:#c62828;--ac:#2456c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e8eaee;--card:#1e2127;--bd:#363b45;--ok:#4cc474;--bad:#ff6b6b;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e8eaee;--card:#1e2127;--bd:#363b45;--ok:#4cc474;--bad:#ff6b6b;--ac:#7aa2ff}
html,body{background:var(--bg)}*{box-sizing:border-box}
body{margin:0;color:var(--fg);font-family:system-ui,Arial,sans-serif;padding:12px;max-width:680px;margin-inline:auto}
h1{font-size:20px;margin:6px 0}h3{margin:14px 0 4px;font-size:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}label{font-size:12px;display:block;text-align:center;font-weight:600}
input[type=text],input[type=number],select{width:100%;font-size:16px;padding:8px 2px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{padding:12px;font-size:17px;border:0;border-radius:10px;background:var(--ac);color:#fff}
.btns{display:flex;gap:8px;margin-top:10px}.btns button{margin:0}#go{flex:2}#clr{flex:1;background:var(--bd);color:var(--fg)}#sign{flex:0 0 52px;background:var(--bd);color:var(--fg)}#hb,#lb,#th{font-size:14px;padding:8px 12px;white-space:nowrap}.tb{display:flex;gap:6px}
.v{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin:6px 0}.v div{padding:8px 2px;border-radius:8px;font-weight:700;border:2px solid}
.ok{color:var(--ok);border-color:var(--ok)}.bad{color:var(--bad);border-color:var(--bad)}.v small{display:block;font-weight:400;font-size:11px}
.ins{font-size:16px;line-height:1.7;margin:4px 0}.tag{font-size:12px;opacity:.75}.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid;margin-inline-start:6px}
.best{border:2px solid var(--ok);background:linear-gradient(180deg,rgba(22,136,58,.14),var(--card));animation:gl 2.2s ease-in-out infinite}@keyframes gl{0%,100%{box-shadow:0 0 0 3px rgba(22,136,58,.25),0 0 14px 2px rgba(22,136,58,.45)}50%{box-shadow:0 0 0 4px rgba(22,136,58,.4),0 0 30px 8px rgba(22,136,58,.7)}}
details{font-size:14px}details summary{cursor:pointer;padding:4px 0}.opt label{display:block;text-align:right;font-weight:400;font-size:14px;margin:6px 0}.opt select,.opt input[type=number]{width:70px;font-size:15px;padding:4px}
#help{display:none}#help p,#help li{font-size:14px;line-height:1.6;margin:3px 0}#help ul,#help ol{padding-inline-start:20px;margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center;margin:4px 0}th,td{border:1px solid var(--bd);padding:3px}
.sc{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 10px;font-size:13px}.chip b{cursor:pointer;margin-inline-start:8px;color:var(--bad)}.cb{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0}.opt .cb label{display:inline-flex;gap:4px;align-items:center;margin:0}.mini{font-size:13px;padding:4px 10px;margin:2px}.row{display:flex;gap:6px}.row select{flex:1}
.err{outline:2px solid var(--bad);border-color:var(--bad)!important}.warn{border-color:#b26a00}
.alts{margin-top:8px}.alt{border-top:1px dashed var(--bd);padding:6px 0;font-size:14px}.altv{font-size:13px}
#max{width:auto;min-width:125px}
.pj{font-size:14px;padding:8px 12px;background:var(--bd);color:var(--fg)}.pj.on{background:var(--ac);color:#fff}
#splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;background:#3f6fd1;transition:opacity .45s ease}#splash img{display:block;width:100%;height:100%;object-fit:cover}#splash.hide{opacity:0;pointer-events:none}
</style></head><body>

<h3>איך לקרוא את התוצאה</h3><ul><li><b>ערכים נוכחיים</b>: מה שהזנת, ירוק או אדום.</li><li><b>כרטיס אפשרות</b>: רשימת הוראות, למשל "התקן: Inner · מיקום M2 · מחבר 1/2 · תוספת 8", ומתחתיה "צפי אחרי תיקון" עם 5 הערכים החזויים.</li><li><b>הכול בטולרנס / יש חריגה</b>: האם האפשרות מביאה את כל הערכים לטווח.</li><li><b>★ הטובה ביותר</b>: הקרובה ביותר לאפס. מוארת ומוצגת ראשונה.</li><li><b>חיפוש מקורב</b>: 4 נקודות ומעלה. ייתכן שקיים שילוב טוב יותר שלא נבדק.</li><li><b>הורחב אוטומטית</b>: הודעה שמופיעה כשנדרשו יותר מ-4 נקודות. אם גם 12 לא הספיקו, מוצגת האפשרות הקרובה ביותר, ואז כדאי לבדוק אם יש יותר מדי נקודות תפוסות.</li><li><b>חלופות</b>: מתחת לאפשרויות עם עד 4 נקודות יש עד שתי חלופות קרובות (שילובים אחרים עם תוצאה קרובה), אם קיימות.</li><li><b>אימות התחזית</b>: אחרי שהתקנת את האפשרות המוארת, הזן בכרטיס "אימות התחזית אחרי ההתקנה" את המדידה החדשה מהמכשיר. האפליקציה משווה לתחזית, ואם יש פער היא בודקת אם הגדרה אחרת (היפוך סימן, מיפוי Xtotal או Z של Outer) מסבירה את המדידה, ומציעה להחיל אותה. אם הורכבו רק חלק מהתוספות, היא מזהה איזו קבוצה מסבירה את המדידה. היא מציגה גם את ההתאמה הטובה ביותר בכל הטבלה (תוספת בודדת או זוג), למקרה שהורכב משהו אחר מהמוצע. הכפתור "השתמש במדידה כערכים נוכחיים" ממשיך את ההתאמה מהמצב שנמדד.</li><li><b>שורה מוצללת בטבלה</b>: תוספת 7 ב-Outer מוצללת בטבלה המקורית וקריאה חלקית. כשהיא מוצעת מופיע סימון, ומומלץ לוודא מול טבלת המקור.</li><li><b>הודעות</b>: "אין צורך בתוספות" = כל הערכים בטולרנס ואין שיפור אפשרי. "לא נמצאה אפשרות שמשפרת" = הערכים עדיין מחוץ לטולרנס ואף שילוב לא משפר (בדוק את הנתונים, נקודות תפוסות או הגדל את מספר התוספות). "קלט לא תקין" = שדה מודגש באדום. "אין נקודות פנויות" = כל הנקודות מסומנות כתפוסות. "נשארו רק N נקודות פנויות" = מספר הנקודות הפנויות קטן ממספר התוספות שביקשת, ולכן אי אפשר להוסיף עוד. "שגיאה בחישוב" ו"החישוב בוטל" מוסברות על המסך.</li></ul>
<h3>כפתורים ושדות</h3><ul><li><b>חשב</b>: מריץ את החיפוש. בזמן החישוב הכפתור הופך ל"בטל חישוב" ומציג את השלב; לחיצה עליו מבטלת. הממשק נשאר פעיל במהלך החישוב, והשדות וההגדרות נעולים עד סיום החישוב או הביטול.</li><li><b>נקה הכל</b>: מנקה את 5 השדות ואת התוצאות (לא את הנקודות התפוסות).</li><li><b>±</b>: הופך את סימן הערך בשדה הפעיל (המקלדת העשרונית לא תמיד מציגה מינוס).</li><li><b>ערכת נושא</b> (בכותרת): אוטו לפי המכשיר, בהיר או כהה.</li><li><b>שמירה</b>: ההגדרות והנקודות התפוסות נשמרות במכשיר. ערכי המדידה לא נשמרים. "אפס הגדרות" (בהגדרות) מחזיר הכול לברירת מחדל.</li><li><b>חיפוש מעמיק להרחבה</b> (בהגדרות): בהרחבה מעל 4 נקודות בודק יותר מועמדים בכל שלב. איטי יותר, ומקטין את הסיכון לפספס פתרון, אך עדיין אינו חיפוש מלא.</li><li><b>כיול: קישור Inner→Xout</b> (בהגדרות): ברירת מחדל 0. מוסיף ל-Xout (ולכן גם ל-Xtotal) חלק יחסי מ-X של תוספת ב-Inner. כרטיס האימות מציע ערך כשהמדידה מראה ש-Xout זז בלי תוספת ב-Outer. מחילים רק אחרי אימות במדידה נוספת.</li><li><b>כל תוספת פעם אחת בלבד</b> (בהגדרות): מונע הצעה של אותו סוג בשני מקומות. מתאים אם יש לך תוספת אחת מכל סוג.</li><li><b>Enter</b>: מעבר לשדה הבא. בשדה האחרון סוגר את המקלדת. החישוב מתבצע רק בלחיצה על "חשב".</li><li><b>הסבר מלא</b>: פותח וסוגר את ההסבר הזה.</li><li><b>נקודות תפוסות</b>: רשימת סימון של כל המיקומים. <b>נקה תפוסות</b> מוחק את הסימונים (הם נשמרים במכשיר עד שתנקה אותם).</li><li><b>מקסימום תוספות</b>: 1–4 קבוע, או "עד טולרנס" (ברירת מחדל) שמרחיב אוטומטית מעבר ל-4.</li><li><b>טולרנס</b>: הסף לירוק/אדום. מספר מ-0 ומעלה. ריק = 70. ערך שלילי או לא מספרי נדחה עם הודעה.</li><li><b>Z של Outer משפיע על Z</b>, <b>X של Inner/Outer משפיע גם על Xtotal</b>: מיפוי ההשפעות. בטל אם אצלך זה שונה.</li><li><b>הפוך סימן</b>: אם בפועל הוספת תוספת מורידה את הערך.</li><li><b>תוספות מיוחדות d/t</b>: שורות 25–32 של M3 (מסומנות ב-*), כבויות כברירת מחדל.</li></ul>
<h3>נקודות תפוסות</h3><ul><li>אם בנקודות מסוימות כבר יש מחבר ותוספת, פתח "נקודות תפוסות" וסמן אותן.</li><li>נקודה תפוסה לא נכנסת לחישוב בכלל, ולא משנה איזה מחבר ואיזו תוספת יש בה.</li><li>הסימון נשמר במכשיר עד שתנקה אותו ("נקה תפוסות" או "אפס הגדרות"). מספר הנקודות התפוסות מוצג מתחת לכפתורים ובראש התוצאות.</li><li>ככל שיש יותר נקודות תפוסות יש פחות מקום לתיקון, ולכן כדאי לסמן רק נקודות שאי אפשר לפנות.</li></ul>
<h3>הנחות ומגבלות</h3><ul><li>Xtotal = Xin + Xout: נראה מתאים לנתוני המכשיר שהזנת (‎-84.64 + ‎-12.93 = ‎-97.57), אבל זו הנחה ולא נתון מהטבלה.</li><li>החיבור הפשוט (ערך חזוי = נוכחי + השפעה), והמיפוי של X/Y/Z לחמשת הערכים, הם הנחות שלי.</li><li>הנחה: יחידות הטבלה זהות ליחידות המכשיר.</li><li>שורות תוספת 7 המוצללות ב-Outer (212, 221, 230, 239, 248, 257, 266, 275) קריאות חלקית במקור (33, 62/119) ותואמות את הדפוס.</li><li>אורכי המחבר ב-M4x/M5x נחתכו במקור, קריאים חלקית (למשל 3/1, 5/1, 1/2) ותואמים את שאר הטבלאות.</li><li>אין מעקב כמויות מלא: ברירת המחדל מניחה שיש מספיק תוספות ומחברים מכל סוג. האפשרות "כל תוספת פעם אחת בלבד" מונעת כפילות סוג, אבל אינה בודקת כמה יחידות יש לך מכל סוג.</li><li>כל 277 השורות (X, Y, Z, מחברים, תוספות) נבדקו שורה-שורה מול כל טבלאות המקור ותואמות. ארבע הזוגות הזהים ב-Outer (M60=M67, M61=M66, M62=M65, M63=M64) כך גם במקור. מה שלא ניתן לאמת מצילום: המיפוי והחיבור הפשוט והיחידות. את זה מאמתים במדידה חוזרת.</li><li>התוצאה היא חיזוי. מדידה חוזרת במכשיר היא האימות האמיתי.</li></ul>

 let verdict;
 if(good)verdict='<div class="card"><b style="color:var(--ok)">התחזית מדויקת</b><br>ההפרש בכל הערכים עד 3 יחידות או 10%. ההנחות מתאימות לציוד עבור האפשרות הזו.</div>';
 else if(bestS&&bestS.e<0.25*e0&&(bestV.ch===0||bestS.e<=bestV.e)){
  const inS=[],outS=[];L.rows.forEach((r,i)=>(bestS.m>>i&1?inS:outS).push(label(r)));
  const offD=NM.map((k,i)=>Math.abs(bestS.d[i]-meas[i])<=Math.max(3,0.1*Math.abs(bestS.d[i]))?null:k+' <bdi dir="ltr">'+fmt(meas[i]-bestS.d[i])+'</bdi>').filter(Boolean);
  verdict='<div class="card warn"><b>המדידה מתאימה להתקנה של חלק מהתוספות בלבד</b><br><span class="tag">(בחירה מתוך התוספות שהוצעו בלבד)</span><br>כאילו הורכבה:<br>'+inS.map(x=>'• '+x).join('<br>')+'<br>ולא הורכבו:<br>'+outS.map(x=>'• '+x).join('<br>')+(offD.length?'<br><span class="tag">פערים שנותרו (נמדד פחות תחזית): '+offD.join(' · ')+'. ערך שזז בלי תוספת שמשפיעה עליו (למשל Xout כשלא הורכבה תוספת ב-Outer) מעיד על רעש מדידה או על קישור בין המנגנונים. מדוד שוב בלי שינוי כדי לבדוק רעש.</span>':'<br><span class="tag">כל הערכים תואמים להתקנה החלקית.</span>')+'</div>';}
 else if(bestV.ch>0&&bestV.e<0.25*e0){const ch=['s','oZ','iXt','oXt'].filter(k=>bestV.f[k]!==f0[k]).map(k=>FLAGN[k]+(k==='s'?(bestV.f.s===-1?': להפעיל':': לכבות'):(bestV.f[k]?': להפעיל':': לכבות')));
  verdict='<div class="card warn"><b>המדידה מתאימה יותר להגדרות אחרות</b><br>'+ch.join('<br>')+'<br><span class="tag">אחרי ההחלה הזן את המדידה החדשה כערכים נוכחיים והרץ שוב.</span><br><button id="applyfit" class="mini">החל הגדרות אלה</button></div>';}
 else verdict='<div class="card bad"><b>התחזית לא תואמת את המדידה</b><br>אין הגדרה שמסבירה את ההפרש. בדוק יחידות, שהמחברים והתוספות הורכבו בדיוק כפי שהוצג, או מדוד שוב.</div>';
 let gCard='',calCard='',calVal=null;
 if(!good){
  const rs=ALL.filter(r=>$('spec').checked||!r.sp),vv=rs.map(r=>vecF(r,f0));
  let b1=null;rs.forEach((r,i)=>{const x=errOf(vv[i]);if(!b1||x<b1.e)b1={e:x,i:[i]}});
  let b2=null;for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){if(rs[i].g===rs[j].g&&rs[i].p===rs[j].p)continue;const x=errOf(vv[i].map((y,k)=>y+vv[j][k]));if(!b2||x<b2.e)b2={e:x,i:[i,j]}}
  const gb=(b2&&b2.e<0.75*b1.e)?b2:b1,gd=gb.i.reduce((d,i)=>d.map((x,k)=>x+vv[i][k]),[0,0,0,0,0]);
  const same=bestS&&gb.i.length===L.rows.filter((r,k)=>bestS.m>>k&1).length&&gb.i.every(i=>L.rows.some((r,k)=>(bestS.m>>k&1)&&r===rs[i]));
  if(!same)gCard='<div class="card"><b>ההתאמה הטובה ביותר בכל הטבלה</b><br>'+gb.i.map(i=>'• '+label(rs[i])).join('<br>')+'<br><span class="tag">פערים (נמדד פחות תחזית): '+NM.map((k,i)=>k+' <bdi dir="ltr">'+fmt(meas[i]-gd[i])+'</bdi>').join(' · ')+'</span><br><span class="tag">זו הערכה מנקודת מדידה אחת בלבד. אם זו אינה ההתקנה שביצעת, ייתכן שהורכב סוג או מיקום אחר מהמוצע.</span></div>';
 {const allIn=gb.i.every(i=>rs[i].g==='in');
  if(allIn){const sX=gb.i.reduce((q,i)=>q+f0.s*rs[i].e[0],0),res=NM.map((k,i)=>meas[i]-gd[i]);
   const fit=[0,1,2].every(i=>Math.abs(res[i])<=Math.max(5,0.1*Math.abs(gd[i])));
   if(fit&&Math.abs(res[4])>3&&Math.abs(sX)>=20){const c2=Math.round(((f0.c||0)+res[4]/sX)*100)/100;
    if(Math.abs(c2)<=1&&c2!==(f0.c||0)){calVal=c2;calCard='<div class="card warn"><b>כיול מוצע: קישור Inner→Xout</b><br>Xin, Y ו-Z תואמים להתקנה, אבל Xout זז בלי תוספת ב-Outer. מקדם <bdi dir="ltr">'+c2+'</bdi> היה מסביר את הפער ב-Xout וב-Xtotal.<br><span class="tag">הערכה מנקודת מדידה אחת: ייתכן שזה רעש מדידה. מדוד שוב ללא שינוי לפני שמחילים. אחרי ההחלה הרץ שוב כדי לראות אפשרויות מעודכנות.</span><br><button id="applycal" class="mini">החל מקדם '+c2+'</button></div>'}}}}
 }
 vo.innerHTML=t+verdict+gCard+calCard+'<button id="usemeas" class="mini" style="width:100%;margin-top:8px">השתמש במדידה כערכים נוכחיים להמשך התאמה</button>';
 const ac=$('applycal');if(ac)ac.onclick=()=>{$('cin').value=String(calVal);saveState();ac.textContent='הוחל';ac.disabled=true};
 $('usemeas').onclick=()=>{after.forEach((x,i)=>{$('v'+i).value=String(x)});$('out').innerHTML='';window.scrollTo({top:0,behavior:'smooth'});$('v0').focus()};
 const ab=$('applyfit');if(ab)ab.onclick=()=>{$('neg').checked=bestV.f.s===-1;$('oZ').checked=bestV.f.oZ;$('iXt').checked=bestV.f.iXt;$('oXt').checked=bestV.f.oXt;saveState();ab.textContent='הוחלו';ab.disabled=true};
}
buildHelp();
$('hb').onclick=()=>{const e=$('help'),o=e.style.display=='block';e.style.display=o?'none':'block';$('hb').textContent=o?'הסבר מלא':'סגור הסבר'};
{const sp=document.getElementById('splash');if(sp){let done=false;const out=()=>{if(done)return;done=true;sp.classList.add('hide');setTimeout(()=>sp.remove(),500)};
 const start=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(out,1500)));
 const im=sp.querySelector('img');try{im&&im.decode?im.decode().then(start,start):start()}catch(e){start()}
 setTimeout(()=>{out();setTimeout(()=>{if(sp.parentNode)sp.remove()},600)},6000)}}
</script></body></html>
